[package]
name = "claude_switcher"
version = "0.1.0"
edition = "2024"

[dependencies]
ksni = { version = "0.3.4", default-features = false, features = ["blocking", "async-io"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
